app = 'monsterindeks'
primary_region = 'arn'

[env]
  PORT = '8080'

# SQLite on a local volume: run exactly one machine (fly scale count 1), or the data splits between volumes.
[[mounts]]
  source = 'monsterdatabase'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "5GB"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
