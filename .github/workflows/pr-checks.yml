name: "PR checks"

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:

jobs:
  go:
    name: "Lint, build and test"
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Setup Go"
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: "Check formatting"
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: "Vet"
        run: go vet ./...

      - name: "Build"
        run: go build -o run-app .

      - name: "Test"
        run: go test ./...

      - name: "Smoke test with a fresh database"
        run: |
          DATABASE_PATH=$RUNNER_TEMP/monsterdatabase.db PORT=8080 ./run-app &
          sleep 2
          curl --fail --silent --show-error http://localhost:8080/health
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/
          curl --fail --silent --show-error http://localhost:8080/get-raw-data

  docker:
    name: "Docker build"
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Build image"
        run: docker build .
